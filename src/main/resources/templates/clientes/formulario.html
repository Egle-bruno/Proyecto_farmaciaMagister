<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Cliente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; padding-top: 50px; }
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 600px; margin: auto; border: none; }
        .card-header { background-color: #0d6efd; color: white; border-radius: 15px 15px 0 0 !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header p-3 text-center">
                <h4 class="mb-0"><i class="bi bi-person-plus-fill"></i> Registro de Cliente</h4>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
                    
                    <input type="hidden" th:field="*{idCliente}" />

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre Completo</label>
                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Juan Pérez" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nro. Documento (DNI/RUC)</label>
                        <input type="text" th:field="*{nroDoc}" class="form-control" placeholder="Ingrese documento" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Teléfono / Celular</label>
                        <input type="text" th:field="*{telefono}" class="form-control" placeholder="Ej: 998765432">
                    </div>

                    <div class="d-flex justify-content-between pt-3 border-top">
                        <a th:href="@{/clientes}" class="btn btn-secondary fw-bold px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary fw-bold px-4">Guardar Cliente</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
