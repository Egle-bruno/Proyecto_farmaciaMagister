<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clientes - Farmacia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; padding-top: 30px; }
        .card-container { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .btn-nuevo { background-color: #0d6efd; color: white; border-radius: 8px; font-weight: 600; transition: 0.3s; }
        .btn-nuevo:hover { background-color: #0b5ed7; box-shadow: 0 4px 8px rgba(13,110,253,0.3); }
        .btn-editar { background-color: #ffc107; color: white; border-radius: 5px; }
        .btn-eliminar { background-color: #dc3545; color: white; border-radius: 5px; }
        .table thead { border-bottom: 2px solid #dee2e6; }
        .alert { border-radius: 10px; border: none; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="card-container">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="text-primary fw-bold mb-0">GESTIÓN DE CLIENTES</h2>
                <a th:href="@{/clientes/nuevo}" class="btn btn-nuevo px-4 shadow-sm">
                    <i class="bi bi-person-plus-fill"></i> Nuevo Cliente
                </a>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="@{/clientes}" method="get" class="row g-2 mb-4">
                <div class="col-auto">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" name="keyword" th:value="${keyword}" 
                               class="form-control border-start-0" placeholder="Buscar DNI o Nombre..." style="width: 250px;">
                    </div>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-dark fw-bold px-4">Buscar</button>
                    <a th:href="@{/clientes}" class="btn btn-outline-secondary" title="Limpiar búsqueda">
                        <i class="bi bi-arrow-clockwise"></i>
                    </a>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="bg-light">
                        <tr class="text-secondary text-uppercase small fw-bold">
                            <th>ID</th>
                            <th>Nombre Completo</th>
                            <th>Nro. Documento</th>
                            <th>Teléfono</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${lista.empty}">
                            <td colspan="5" class="text-center text-muted py-4">No se encontraron clientes registrados.</td>
                        </tr>
                        <tr th:each="c : ${lista}">
                            <td th:text="${c.idCliente}" class="fw-bold"></td>
                            <td th:text="${c.nombre}"></td>
                            <td><span class="badge bg-light text-dark border" th:text="${c.nroDoc}"></span></td>
                            <td th:text="${c.telefono}"></td>
                            <td class="text-center">
                                <a th:href="@{/clientes/editar/{id}(id=${c.idCliente})}" class="btn btn-editar btn-sm px-3 me-2 text-white shadow-sm">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </a>
                                <a th:href="@{/clientes/eliminar/{id}(id=${c.idCliente})}" 
                                   class="btn btn-eliminar btn-sm px-3 shadow-sm"
                                   onclick="return confirm('¿Está seguro de eliminar este cliente?')">
                                    <i class="bi bi-trash-fill"></i> Borrar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-4 border-top pt-4">
                <a th:href="@{/home}" class="btn btn-secondary fw-bold px-4 shadow-sm">
                    <i class="bi bi-house-door-fill"></i> Volver al Menú Principal
                </a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
