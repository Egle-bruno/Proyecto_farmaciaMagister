<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Farmacia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        .btn-ingresar { background: #0d6efd; color: white; border-radius: 10px; font-weight: 600; width: 100%; padding: 12px; border: none; }
        .form-control { border-radius: 10px; padding: 12px; }
        /* Estilo del mensaje de error */
        .error-msg { background-color: #f8d7da; color: #842029; padding: 10px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 20px; text-align: center; border: 1px solid #f5c2c7; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <h3 class="fw-bold">Sistema Farmacia</h3>
            <p class="text-muted small">Inicie sesión para continuar</p>
        </div>

        <div th:if="${param.error}" class="error-msg">
            <i class="bi bi-exclamation-circle-fill"></i> Usuario o contraseña incorrectos
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-bold">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Usuario" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn btn-ingresar shadow-sm">Ingresar</button>
        </form>
    </div>
</body>
</html>
