<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Proveedores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .btn-regresar { margin-top: 20px; }
    </style>
</head>
<body class="container mt-4">
    <div class="row">
        <div class="col-md-12">
            <h2 class="mb-4">Mantenimiento de Proveedores</h2>
            <a th:href="@{/proveedores/nuevo}" class="btn btn-primary mb-3">Nuevo Proveedor</a>
            
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Razón Social</th>
                        <th>RUC</th>
                        <th>Dirección</th>
                        <th>Teléfono</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${lista}">
                        <td th:text="${p.idProveedor}"></td>
                        <td th:text="${p.razonSocial}"></td>
                        <td th:text="${p.ruc}"></td>
                        <td th:text="${p.direccion}"></td>
                        <td th:text="${p.telefono}"></td>
                        <td>
                            <a th:href="@{/proveedores/editar/{id}(id=${p.idProveedor})}" class="btn btn-warning btn-sm">Editar</a>
                            <a th:href="@{/proveedores/eliminar/{id}(id=${p.idProveedor})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Está seguro de eliminar este proveedor?')">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div class="btn-regresar">
                <a th:href="@{/home}" class="btn btn-secondary">Volver al inicio</a>
            </div>
        </div>
    </div>
</body>
</html>
