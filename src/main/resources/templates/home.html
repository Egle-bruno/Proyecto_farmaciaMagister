<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal - Farmacia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .main-container {
            background: white;
            padding: 50px;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 95%;
            max-width: 1200px;
        }
        .card-menu {
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 160px;
            font-weight: 700;
            border-radius: 35px; /* Las curvas que solicitaste */
            text-align: center;
            padding: 20px;
            border: none;
            font-size: 1rem;
        }
        .card-menu:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
            color: white;
        }
        /* Tus colores originales */
        .bg-azul { background-color: #0d6efd; color: white; }
        .bg-amarillo { background-color: #ffc107; color: #333; }
        .bg-verde { background-color: #198754; color: white; }
        .bg-rojo { background-color: #dc3545; color: white; }
    </style>
</head>
<body>
    <div class="main-container text-center">
        <h1 class="display-5 fw-bold text-primary mb-2">SISTEMA DE GESTIÓN - FARMACIA</h1>
        <p class="text-muted mb-5">Panel de Control </p>

        <div class="row g-4">
            <div class="col-md-3">
                <a th:href="@{/ventas}" class="card-menu bg-azul">VENTAS E HISTORIAL</a>
            </div>
            
            <div class="col-md-3">
                <a th:href="@{/clientes}" class="card-menu bg-amarillo">GESTIONAR CLIENTES</a>
            </div>
            
            <div class="col-md-3">
                <a th:href="@{/proveedores}" class="card-menu bg-verde">GESTIONAR PROVEEDORES</a>
            </div>
            
            <div class="col-md-3">
                <a th:href="@{/productos}" class="card-menu bg-rojo">INVENTARIO (STOCK)</a>
            </div>
        </div>
    </div>
</body>
</html>
