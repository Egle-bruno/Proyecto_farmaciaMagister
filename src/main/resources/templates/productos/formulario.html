<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Datos del Producto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; padding-top: 50px; }
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        .card-header { background-color: #212529; color: white; border-radius: 15px 15px 0 0 !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header p-3">
                <h4 class="mb-0"><i class="bi bi-capsule"></i> Datos del Producto</h4>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
                    
                    <input type="hidden" th:field="*{idProducto}" />

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre del Producto</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Descripción</label>
                        <input type="text" th:field="*{descripcion}" class="form-control">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Precio de Venta (S/)</label>
                            <input type="number" step="0.01" th:field="*{precioVenta}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Stock Actual</label>
                            <input type="number" th:field="*{stock}" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Fecha de Vencimiento</label>
                        <input type="date" th:field="*{fechaVencimiento}" class="form-control">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Proveedor</label>
                        <select th:field="*{proveedor.idProveedor}" class="form-select" required>
                            <option value="">-- Seleccione un proveedor --</option>
                            <option th:each="prov : ${proveedores}" 
                                    th:value="${prov.idProveedor}" 
                                    th:text="${prov.razonSocial}"></option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between pt-3 border-top">
                        <a th:href="@{/productos}" class="btn btn-secondary fw-bold px-4 shadow-sm">Cancelar</a>
                        <button type="submit" class="btn btn-success fw-bold px-4 shadow-sm">Guardar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
