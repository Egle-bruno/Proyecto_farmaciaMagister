<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario de Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; }
        .container { margin-top: 50px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .table thead { background-color: #212529; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <h2 class="text-primary fw-bold"><i class="bi bi-box-seam"></i> Inventario de Productos</h2>
            <div>
                <a th:href="@{/productos/nuevo}" class="btn btn-success fw-bold shadow-sm">+ Nuevo Producto</a>
                <a th:href="@{/productos/exportarPdf}" class="btn btn-danger fw-bold shadow-sm"><i class="bi bi-file-earmark-pdf-fill"></i> Descargar PDF</a>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="table-responsive">
            <table class="table table-hover align-middle table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio Venta</th>
                        <th>Stock</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${productos}">
                        <td th:text="${p.idProducto}"></td>
                        <td th:text="${p.nombre}"></td>
                        <td th:text="'S/ ' + ${p.precioVenta}"></td>
                        <td>
                            <span class="badge" th:classappend="${p.stock > 10 ? 'bg-success' : 'bg-danger'}" th:text="${p.stock}"></span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/productos/editar/{id}(id=${p.idProducto})}" class="btn btn-warning btn-sm text-white"><i class="bi bi-pencil-square"></i></a>
                            
                            <a th:href="@{/productos/eliminar/{id}(id=${p.idProducto})}" 
                               class="btn btn-dark btn-sm" 
                               onclick="return confirm('¿Seguro que deseas eliminar este producto?')"><i class="bi bi-trash-fill"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-4 pt-3 border-top">
            <a th:href="@{/home}" class="btn btn-secondary shadow-sm fw-bold">
                <i class="bi bi-house-door-fill me-2"></i> Volver al Inicio
            </a>
        </div>
    </div>
</body>
</html>
