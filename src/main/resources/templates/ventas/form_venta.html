<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Venta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-success text-white"><h3>Registrar Venta</h3></div>
        <div class="card-body">
            <form th:action="@{/ventas/guardar}" method="post">
                <div class="mb-3">
                    <label class="form-label">Cliente:</label>
                    <select name="clienteId" class="form-select" required>
                        <option th:each="c : ${clientes}" th:value="${c.idCliente}" th:text="${c.nombre}"></option>
                    </select>
                </div>
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label class="form-label">Producto:</label>
                        <select name="productoId" class="form-select" required>
                            <option th:each="p : ${productos}" th:value="${p.idProducto}" th:text="${p.nombre + ' - S/ ' + p.precioVenta}"></option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Cantidad:</label>
                        <input type="number" name="cantidad" class="form-control" min="1" value="1" required>
                    </div>
                </div>
                <div class="d-flex justify-content-between mt-4">
                    <a th:href="@{/home}" class="btn btn-secondary">Volver al Inicio</a>
                    <button type="submit" class="btn btn-success">Finalizar Venta</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
