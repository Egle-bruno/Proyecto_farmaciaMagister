<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Boleta Detallada</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-dark text-white d-flex justify-content-between">
            <h3 class="mb-0">Boleta de Venta N° <span th:text="${venta.idVenta}"></span></h3>
        </div>
        <div class="card-body">
            <p><strong>Cliente:</strong> <span th:text="${venta.cliente.nombre}"></span></p>
            <p><strong>Fecha de Emisión:</strong> <span th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm')}"></span></p>

            <table class="table table-striped mt-3">
                <thead class="table-secondary">
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio Unitario</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="d : ${detalles}">
                        <td th:text="${d.producto.nombre}"></td>
                        <td th:text="${d.cantidad}"></td>
                        <td th:text="'S/ ' + ${d.precioUnitario}"></td>
                        <td th:text="'S/ ' + ${d.subtotal}"></td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr class="table-info">
                        <th colspan="3" class="text-end">TOTAL PAGADO:</th>
                        <th th:text="'S/ ' + ${venta.total}" class="h5"></th>
                    </tr>
                </tfoot>
            </table>
            
            <div class="mt-4 no-print">
                <a th:href="@{/ventas}" class="btn btn-secondary">Regresar al Historial</a>
                <button onclick="window.print()" class="btn btn-success">Imprimir Comprobante</button>
            </div>
        </div>
    </div>
</body>
</html>
