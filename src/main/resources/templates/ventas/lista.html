<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial de Ventas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Historial de Ventas</h2>
        <a th:href="@{/ventas/nuevo}" class="btn btn-primary">Nueva Venta</a>
    </div>
    
    <table class="table table-bordered shadow-sm">
        <thead class="table-dark text-center">
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="v : ${lista}" class="text-center align-middle">
                <td>
                    <a th:href="@{/ventas/detalle/{id}(id=${v.idVenta})}" 
                       th:text="${v.idVenta}" class="btn btn-sm btn-outline-primary fw-bold"></a>
                </td>
                <td th:text="${#temporals.format(v.fechaVenta, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${v.cliente.nombre}"></td>
                <td th:text="${'S/ ' + v.total}" class="fw-bold"></td>
            </tr>
        </tbody>
    </table>
    
    <div class="mt-3">
        <a th:href="@{/home}" class="btn btn-secondary">Volver al Inicio</a>
    </div>
</body>
</html>
