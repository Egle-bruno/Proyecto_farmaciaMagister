<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comprobante de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 30px; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card-header { background-color: #212529; color: white; padding: 15px; border-radius: 10px 10px 0 0 !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card mx-auto" style="max-width: 700px;">
            <div class="card-header d-flex justify-content-between">
                <h4 class="mb-0">BOLETA DE VENTA</h4>
                <span th:text="'Nro: ' + ${venta.idVenta}"></span>
            </div>
            <div class="card-body p-4">
                <div class="row mb-4">
                    <div class="col-6">
                        <h5 class="fw-bold">FARMACIA BRUNO</h5>
                        <p class="text-muted" th:text="'Fecha: ' + ${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm')}"></p>
                    </div>
                    <div class="col-6 text-end">
                        <h6 class="fw-bold">CLIENTE:</h6>
                        <p class="mb-0" th:text="${venta.cliente.nombre}"></p>
                        <p class="mb-0" th:text="'Doc: ' + ${venta.cliente.nroDoc}"></p>
                    </div>
                </div>

                <table class="table">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th class="text-center">Cant.</th>
                            <th class="text-end">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="d : ${venta.detalles}">
                            <td th:text="${d.producto.nombre}"></td>
                            <td class="text-center" th:text="${d.cantidad}"></td>
                            <td class="text-end" th:text="'S/ ' + ${d.subtotal}"></td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <th colspan="2" class="text-end">TOTAL A PAGAR:</th>
                            <th class="text-end text-primary" th:text="'S/ ' + ${venta.total}"></th>
                        </tr>
                    </tfoot>
                </table>

                <div class="mt-4 d-flex justify-content-between">
                    <a th:href="@{/home}" class="btn btn-secondary">Inicio</a>
                    <button onclick="window.print()" class="btn btn-dark">Imprimir</button>
                    <a th:href="@{/ventas/nuevo}" class="btn btn-success">Nueva Venta</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
